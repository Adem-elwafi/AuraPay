<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="vaultis-icon">
  <defs>
    <!-- Gradients néon haute fidélité -->
    <linearGradient id="vShieldGrad1" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="vShieldGrad2" x1="90%" y1="15%" x2="10%" y2="85%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="vShieldAccent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Filtre de lueur subtile pour le mode sombre -->
    <filter id="vShieldGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Groupe Emblème Bouclier Minimaliste V -->
  <g filter="url(#vShieldGlow)">
    <!-- Crête supérieure du bouclier (facette protectrice) -->
    <path 
      d="M50 14 L24 23 C23 23.4 22 24.5 22 26 L22 35 L50 24 L78 35 L78 26 C78 24.5 77 23.4 76 23 Z" 
      fill="url(#vShieldAccent)" 
      opacity="0.95"
    />

    <!-- Aile gauche du 'V' (ruban plongeant vers la pointe) -->
    <path 
      d="M22 31 L22 52 C22 66 33 79 50 86 C50 86 36 74 34 54 L34 39 L47 48 L41 68 C41 68 31 56 31 46 L31 34 Z" 
      fill="url(#vShieldGrad2)" 
      opacity="0.85"
    />

    <!-- Branche principale du 'V' (courbe aérodynamique centrale) -->
    <path 
      d="M29 33 L44 71 C46.5 77 53.5 77 56 71 L71 33 L61 33 L50 62 L39 33 Z" 
      fill="url(#vShieldGrad1)"
    />

    <!-- Aile droite protectrice (fermeture bouclier) -->
    <path 
      d="M78 31 L78 52 C78 66 67 79 50 86 C55 82 66 74 66 54 L66 39 L53 48 L59 68 C61 64 69 56 69 46 L69 34 Z" 
      fill="url(#vShieldGrad2)" 
      opacity="0.9"
    />

    <!-- Pointe de cœur biseautée (stabilité & ancrage) -->
    <path 
      d="M50 86 L44 73 L56 73 Z" 
      fill="url(#vShieldAccent)"
    />
  </g>
</svg>
