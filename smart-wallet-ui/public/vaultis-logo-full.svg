<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="vaultis-full-logo">
  <defs>
    <linearGradient id="vGradShieldA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="vGradShieldB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emblème Icone (Positionné à gauche, 48x48) -->
  <g transform="translate(4, 8) scale(0.48)" filter="url(#logoGlow)">
    <!-- Crête supérieure -->
    <path 
      d="M50 14 L24 23 C23 23.4 22 24.5 22 26 L22 35 L50 24 L78 35 L78 26 C78 24.5 77 23.4 76 23 Z" 
      fill="url(#vGradShieldB)" 
      opacity="0.95"
    />

    <!-- Aile gauche -->
    <path 
      d="M22 31 L22 52 C22 66 33 79 50 86 C50 86 36 74 34 54 L34 39 L47 48 L41 68 C41 68 31 56 31 46 L31 34 Z" 
      fill="url(#vGradShieldA)" 
      opacity="0.85"
    />

    <!-- Branche principale V -->
    <path 
      d="M29 33 L44 71 C46.5 77 53.5 77 56 71 L71 33 L61 33 L50 62 L39 33 Z" 
      fill="url(#vGradShieldA)"
    />

    <!-- Aile droite -->
    <path 
      d="M78 31 L78 52 C78 66 67 79 50 86 C55 82 66 74 66 54 L66 39 L53 48 L59 68 C61 64 69 56 69 46 L69 34 Z" 
      fill="url(#vGradShieldB)" 
      opacity="0.9"
    />

    <!-- Pointe -->
    <path 
      d="M50 86 L44 73 L56 73 Z" 
      fill="url(#vGradShieldB)"
    />
  </g>

  <!-- Typography: VAULTIS -->
  <text 
    x="64" 
    y="35" 
    fill="url(#textGrad)" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
    font-size="24" 
    font-weight="800" 
    letter-spacing="0.12em"
  >
    VAULTIS
  </text>

  <!-- Subtitle Tag: SMART WALLET -->
  <g transform="translate(64, 42)">
    <text 
      x="0" 
      y="9" 
      fill="#38BDF8" 
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif" 
      font-size="8.5" 
      font-weight="700" 
      letter-spacing="0.28em" 
      opacity="0.9"
    >
      SMART WALLET
    </text>
  </g>

  <!-- Badge FinTech Subtle Dot / Indicator -->
  <circle cx="216" cy="24" r="2.5" fill="#2DD4BF" opacity="0.9" />
</svg>
